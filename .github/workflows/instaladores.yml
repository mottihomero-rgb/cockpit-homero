# Gera o instalador do Mac e do Windows e publica na aba Releases.
# Dispara ao subir uma etiqueta de versão (ex.: git tag v1.2.0 && git push homero v1.2.0)
# ou à mão, pela aba Actions.
name: Instaladores

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            comando: npm run build
            app: dist/mac-arm64/Cockpit.app/Contents/MacOS/Cockpit
            arquivos: |
              dist/*.dmg
              dist/*.zip
          - os: windows-latest
            comando: npm run build:win
            app: dist/win-unpacked/Cockpit.exe
            arquivos: dist/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Testes
        run: npm test
      - name: Gerar instalador
        run: ${{ matrix.comando }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Abrir o app pronto e testar tela e terminal
        run: node tests/fumaca-app.cjs "${{ matrix.app }}" dist
      - name: Windows - rodar o instalador e abrir o app instalado
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $inst = Get-ChildItem dist\*-Windows.exe | Select-Object -First 1
          Start-Process $inst.FullName -ArgumentList '/S' -Wait
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter Cockpit.exe | Select-Object -First 1
          if (-not $exe) { throw 'o instalador nao deixou o Cockpit.exe instalado' }
          Write-Host "instalado em $($exe.FullName)"
          $atalho = Test-Path "$env:USERPROFILE\Desktop\Cockpit.lnk"
          Write-Host "atalho na area de trabalho: $atalho"
          node tests/fumaca-app.cjs $exe.FullName dist
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: print-${{ matrix.os }}
          path: dist/cockpit-*.png
      - uses: actions/upload-artifact@v4
        with:
          name: cockpit-${{ matrix.os }}
          path: ${{ matrix.arquivos }}
      - name: Publicar na Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "Cockpit $GITHUB_REF_NAME" --notes "Instaladores do Mac (Apple Silicon) e do Windows (64 bits). Como instalar: ver o README."
          shopt -s nullglob
          gh release upload "$GITHUB_REF_NAME" dist/*.dmg dist/*.zip dist/*.exe --clobber
