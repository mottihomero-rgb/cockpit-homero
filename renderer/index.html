<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
<title>Cockpit</title>
<!-- põe o data-theme certo no <html> antes do primeiro quadro pintado (ver aparencia.js) -->
<script src="aparencia.js"></script>
<link rel="stylesheet" href="vendor/xterm.css">
<!-- tokens do redesenho (cores, raios, espaço, movimento) ANTES do style.css: ele e o
     redesign/*.css só usam as variáveis daqui. -->
<link rel="stylesheet" href="cockpit-tokens.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="quadro.css">
<!-- redesenho por área (25/09): cada arquivo cobre uma parte da tela e vem DEPOIS do CSS antigo,
     para ganhar dele sem precisar de !important. base.css primeiro (tipografia, foco, botões rd-). -->
<link rel="stylesheet" href="redesign/base.css">
<link rel="stylesheet" href="redesign/janela.css">
<link rel="stylesheet" href="redesign/painel.css">
<link rel="stylesheet" href="redesign/mensagens.css">
<link rel="stylesheet" href="redesign/passos.css">
<link rel="stylesheet" href="redesign/caixa.css">
<link rel="stylesheet" href="redesign/lateral.css">
<link rel="stylesheet" href="redesign/menus.css">
<link rel="stylesheet" href="redesign/sheets.css">
</head>
<body>

<!-- escondida desde 10/09 (visual do Hugo): a faixa de abas faz o papel dela no Mac.
     Continua no HTML porque o app.js escreve no #tbTitle. -->
<div id="titlebar" class="hidden">
  <div class="tb-drag"></div>
  <div class="tb-center" id="tbTitle">Cockpit</div>
  <div class="tb-right"></div>
</div>

<!-- leva 6: faixa de avisos que vale para a janela inteira (caixa de entrada do celular).
     No Mac (redesenho de 25/09) ela entra no fluxo LOGO ABAIXO da barra do topo e empurra os
     chats para baixo: o janela.css põe o body em coluna e a reordena com `order`, então ela
     pode continuar aqui em cima no HTML. -->
<div id="faixaAvisos"></div>

<div id="abasTopo">
  <!-- as duas folgas crescem por igual: as abas ficam no meio do topo -->
  <span class="abas-gap"></span>
  <div class="abas-lista" id="abasLista"></div>
  <!-- a aba que está nascendo: só aparece com a sheet "Nova aba" aberta (janela.css) -->
  <span class="aba-provisoria" aria-hidden="true">Nova aba</span>
  <button class="aba-mais" id="btnNovaAba" title="Nova aba ⌘⇧T"><svg viewBox="0 0 16 16" class="ic" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M8 3v10M3 8h10"></path></g></svg></button>
  <span class="abas-gap"></span>
  <button class="aba-mais canto" id="btnNovoChat" title="Novo chat nesta aba ⌘T"><svg viewBox="0 0 16 16" class="ic" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M8 3v10M3 8h10"></path></g></svg><span class="am-txt">Chat</span></button>
</div>

<div id="shell">
  <nav id="activitybar">
    <!-- sem "active" aqui: a coluna comeca FECHADA, entao nenhum icone pode nascer marcado.
         quem marca e o sincronizarIconesLaterais(), sempre olhando se a coluna esta aberta -->
    <button class="act ic-conversas" data-view="conversas" title="Conversas">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><path d="M4 3h8a1.5 1.5 0 0 1 1.5 1.5v5A1.5 1.5 0 0 1 12 11H6.5l-3 2.5v-2.7a1.5 1.5 0 0 1-1-1.3v-5A1.5 1.5 0 0 1 4 3z"></path></g></svg>
    </button>
    <!-- o separador de 20×1 do redesenho: Conversas em cima, as ferramentas da janela embaixo -->
    <div class="act-sep" aria-hidden="true"></div>
    <!-- leva 10.2: torre de controle — todas as sessões, aqui e fora do Cockpit -->
    <button class="act" data-view="torre" title="Torre de controle: todos os chats, aqui e fora do Cockpit">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><circle cx="8" cy="8" r="1.3" fill="currentColor" stroke="none"></circle><path d="M5.3 5.3a3.8 3.8 0 0 0 0 5.4M10.7 5.3a3.8 3.8 0 0 1 0 5.4M3.2 3.2a6.8 6.8 0 0 0 0 9.6M12.8 3.2a6.8 6.8 0 0 1 0 9.6"></path></g></svg>
    </button>
    <!-- leva 11: rotinas — os robôs agendados que rodam sozinhos nesta máquina -->
    <button class="act" data-view="rotinas" title="Rotinas: os robôs agendados que rodam sozinhos nesta máquina">
      <!-- quantos robôs dele pararam: o aviso chega sem precisar abrir a coluna -->
      <span class="act-selo hidden"></span>
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><circle cx="8" cy="8" r="6"></circle><path d="M8 4.75V8l2.25 1.5"></path></g></svg>
    </button>
    <button class="act" data-view="settings" title="Ajustes">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M2.5 5h5.5M12 5h1.5M2.5 11h1.5M8 11h5.5"></path><circle cx="10" cy="5" r="1.75"></circle><circle cx="6" cy="11" r="1.75"></circle></g></svg>
    </button>
  </nav>

  <aside id="sidebar">
    <!-- UMA lista so, de todas as IAs (25/09). Antes era uma coluna por motor: trocar de IA
         no meio do chat partia a conversa em dois pedacos, cada um numa coluna diferente.
         Agora a conversa costurada aparece uma vez, com o logo de cada IA que trabalhou nela.
         O filtro, a busca, os grupos e o "Novo chat" continuam os mesmos, so que valem para tudo. -->
    <div class="side-view" data-view="conversas">
      <div class="side-head"><span>Conversas</span><button class="mini" data-reload="todas" title="Atualizar agora"><svg viewBox="0 0 16 16" class="ic" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M13 8a5 5 0 1 1-1.5-3.6M13 2.5v3h-3"></path></g></svg></button></div>
      <!-- uso do plano: um bloco curto por IA que tem numero (pintarUsoLateral) -->
      <div class="cv-uso" id="cvUso"></div>
      <button class="side-filtro" data-filtro="todas"><span class="sf-txt">Mac inteiro</span><span class="sf-seta"></span></button>
      <div class="side-pastas hidden" data-pastas="todas"></div>
      <input class="side-busca" data-busca="todas" placeholder="Buscar em tudo…">
      <!-- faixa de grupos de conversa (leva 8): desenhada por pintarAbasGrupo -->
      <div class="grp-abas" data-grupos="todas"></div>
      <button class="new-chat" data-new="foco"><svg viewBox="0 0 16 16" class="ic" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M8 3v10M3 8h10"></path></g></svg> Novo chat nesta aba</button>
      <!-- a IA cuja lista não veio: logo + "indisponível", o motivo no title (pintarErrosDaLista) -->
      <div class="cv-erros" id="cvErros"></div>
      <div class="hist" id="histTodas"></div>
    </div>
    <!-- leva 10.2: a torre é desenhada por pintarTorre() -->
    <div class="side-view hidden" data-view="torre">
      <div class="side-head"><span>Torre de controle</span><button class="mini" id="btnTorreAtualizar" title="Atualizar agora"></button></div>
      <div class="torre" id="torre"></div>
    </div>
    <!-- leva 11: a lista é desenhada por pintarRotinas() -->
    <div class="side-view hidden" data-view="rotinas">
      <div class="side-head"><span>Rotinas do Mac</span><button class="mini" id="btnRotinasAtualizar" title="Atualizar agora"></button></div>
      <div class="rot" id="rotinas"></div>
    </div>
    <div class="side-view hidden" data-view="settings">
      <div class="side-head"><span>Ajustes</span></div>
      <!-- Cada bloco é só título + controle. A explicação mora no (i) do título: o app.js
           mostra o texto de data-dica ao passar o mouse (no celular, ao tocar). -->
      <div class="settings">
        <section class="aj">
          <div class="aj-tit">Celular<button class="info" type="button" aria-label="Como funciona" data-dica="No iPhone, ligue o Tailscale e abra o endereço abaixo no Safari. Depois toque em Compartilhar › Adicionar à Tela de Início. As conversas são as mesmas do Mac, então deixe o Mac ligado."></button></div>
          <label class="chave"><input type="checkbox" id="chkWeb"><span>Liberar acesso</span></label>
          <div id="webInfo" class="web-info hidden"></div>
        </section>

        <section class="aj">
          <div class="aj-tit">Aparência<button class="info" type="button" aria-label="Como funciona" data-dica="Automática segue o claro e o escuro do Mac. Com Aumentar contraste ou Reduzir transparência ligados no Mac, o Cockpit reforça o contraste sozinho."></button></div>
          <div class="temas">
            <button class="tema-bt" data-aparencia="auto"><span class="tema-am aut"></span>Automática</button>
            <button class="tema-bt" data-aparencia="clara"><span class="tema-am cla"></span>Clara</button>
            <button class="tema-bt" data-aparencia="escura"><span class="tema-am esc"></span>Escura</button>
          </div>
        </section>

        <section class="aj">
          <div class="aj-tit">Sua foto</div>
          <div class="foto-linha">
            <div class="foto-prev" id="fotoPrev"></div>
            <div class="foto-btns">
              <button class="btn-wide" id="btnFoto">Escolher foto</button>
              <button class="btn-wide" id="btnFotoTirar">Remover</button>
            </div>
          </div>
        </section>

        <section class="aj">
          <div class="aj-tit">Pasta inicial<button class="info" type="button" aria-label="Como funciona" data-dica="É a pasta onde os chats novos começam a trabalhar."></button></div>
          <div class="path-box" id="defCwd">—</div>
          <button class="btn-wide" id="btnDefCwd">Trocar pasta</button>
        </section>

        <section class="aj">
          <div class="aj-tit">Voz<button class="info" type="button" aria-label="Como funciona" data-dica="Ligado, aperte ⌃⌥Espaço em qualquer programa: o Cockpit vem para a frente e o microfone liga. Enquanto fala, diga “manda” para enviar, “cancela” para parar, “apaga isso” ou “próximo painel”."></button></div>
          <label class="chave"><input type="checkbox" id="chkAtalhosGlobais"><span>Atalho de voz</span></label>
          <p class="hint hidden" id="atalhosAviso"></p>
        </section>

        <!-- leva 6: o caminho MUDA entre rodar por npm start (pasta "cockpit") e o app
             instalado (pasta "Cockpit"). Nenhum script pode cravar: é daqui que se copia. -->
        <section class="aj" id="inboxBloco">
          <div class="aj-tit">Caixa de entrada<button class="info" type="button" aria-label="Como funciona" data-dica="Texto (.txt ou .md) ou imagem que cair nesta pasta vira um aviso no topo da tela, com o botão “usar”. É por aqui que o celular e os robôs mandam coisas para cá."></button></div>
          <div class="path-box" id="inboxPasta">—</div>
          <button class="btn-wide" id="btnInboxAbrir">Abrir pasta</button>
        </section>

        <section class="aj">
          <div class="aj-tit">Conversas<button class="info" type="button" aria-label="Como funciona" data-dica="Ligado, a lista mostra também as conversas do robô do WhatsApp e dos robôs agendados. Desligado, mostra só as suas."></button></div>
          <label class="chave"><input type="checkbox" id="chkRobos"><span>Mostrar robôs</span></label>
        </section>

        <div class="aj-rodape"><span id="verLine">Cockpit</span><button class="info" type="button" aria-label="Sobre" data-dica="Acesso total ligado: os chats enxergam o Mac inteiro. A pasta escolhida é só o ponto de partida. O Codex usa a sua conta do ChatGPT. O Claude usa o Claude Code já instalado, com suas skills e memória."></button></div>
      </div>
    </div>
  </aside>
  <div id="dragbar"></div>

  <div id="panes"></div>
</div>

<!-- tela do meio: escolher motor e pasta da aba nova -->
<div id="novaAba" class="hidden">
  <div class="na-cx">
    <h1 class="na-tit">Nova aba</h1>

    <div class="na-rot">Com quem o primeiro chat vai ser</div>
    <div class="na-motores">
      <button class="na-motor on" data-motor="claude">
        <span class="na-ico" id="naIcClaude"></span>
        <span class="na-n">Claude</span>
      </button>
      <button class="na-motor" data-motor="codex">
        <span class="na-ico" id="naIcCodex"></span>
        <span class="na-n">Codex</span>
      </button>
      <button class="na-motor" data-motor="gemini">
        <span class="na-ico" id="naIcGemini"></span>
        <span class="na-n">Gemini</span>
      </button>
      <button class="na-motor" data-motor="grok">
        <span class="na-ico" id="naIcGrok"></span>
        <span class="na-n">Grok</span>
      </button>
    </div>

    <div class="na-rot">Onde ele vai trabalhar</div>
    <div class="na-ondes">
      <button class="na-onde on" data-onde="mac"><span class="na-onde-ic"></span><span>Neste Mac</span></button>
      <button class="na-onde" data-onde="vps"><span class="na-onde-ic"></span><span>Na VPS</span></button>
    </div>

    <div class="na-rot">Pasta do projeto</div>
    <!-- os clientes e as pastas usadas por ultimo, em botao. A janela de pastas do Mac (o
         botao logo abaixo) virou o ultimo recurso, nao o unico caminho. -->
    <div class="na-atalhos" id="naAtalhosMac"></div>
    <button class="na-pasta" id="naPasta">
      <span class="na-pasta-ic"></span>
      <span class="na-pasta-txt">Escolher a pasta do projeto…</span>
    </button>
    <div class="na-remoto hidden" id="naRemoto">
      <input class="na-caminho" id="naCaminho" placeholder="/opt/adsure" spellcheck="false">
      <div class="na-atalhos" id="naAtalhos"></div>
    </div>
    <div class="na-escolhida hidden" id="naEscolhida">
      <span class="na-esc-nome" id="naPastaNome"></span>
      <button class="na-esc-x" id="naPastaX" title="Tirar a pasta"></button>
    </div>

    <button class="na-ok" id="naOk">Começar</button>
    <p class="na-dica" id="naDica"></p>
    <button class="na-dois hidden" id="naDois">
      <span class="na-ico peq" id="naDoisA"></span>
      <span class="na-mais">+</span>
      <span class="na-ico peq" id="naDoisB"></span>
      <span>Começar com os dois lado a lado</span>
    </button>
  </div>
</div>

<!-- lista de atalhos do teclado (⌘/) -->
<div id="telaAtalhos" class="hidden">
  <div class="at-cx">
    <h1 class="at-tit">Atalhos do teclado</h1>
    <div id="atLista"></div>
    <p class="at-pe">⌘/ abre e fecha esta lista · Esc fecha</p>
  </div>
</div>

<!-- janelinha e menu que NAO pertencem a nenhum chat: a lista de conversas é da tela inteira,
     e a janelinha de dentro do painel ficaria presa dentro de um chat -->
<div class="modal global hidden" id="modalGrupo"><div class="modal-cx"></div></div>
<div class="pop-global hidden" id="popGrupo"></div>

<template id="tplEspaco">
  <div class="espaco"></div>
</template>

<template id="tplAba">
  <div class="aba" draggable="false">
    <!-- cápsula do redesenho (25/09): sinal + nome + contador, e o × só no hover.
         .aba-dot é o sinal único (esperando > trabalhando > nova); .aba-ic é a marca da VPS;
         .aba-tit é o contador de chats (pintarAba). -->
    <span class="aba-dot dot off" aria-hidden="true"></span>
    <span class="aba-ic" aria-hidden="true"><svg viewBox="0 0 16 16" class="ic" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.25" y="2.5" width="11.5" height="4.75" rx="1.25"/><rect x="2.25" y="8.75" width="11.5" height="4.75" rx="1.25"/><circle cx="5" cy="4.9" r=".8" fill="currentColor" stroke="none"/><circle cx="5" cy="11.1" r=".8" fill="currentColor" stroke="none"/></svg></span>
    <span class="aba-proj"></span>
    <span class="aba-tit"></span>
    <button class="aba-x" title="Fechar a aba e os chats dela"><svg viewBox="0 0 16 16" class="ic" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7"></path></g></svg></button>
  </div>
</template>

<template id="tplPane">
  <section class="pane">
    <header class="pane-hd">
      <div class="p-chave" role="group" aria-label="Escolher assistente">
        <button class="ch-lado" data-motor="claude"><span></span><span class="ch-nome">Claude</span></button>
        <button class="ch-lado" data-motor="codex"><span></span><span class="ch-nome">Codex</span></button>
        <button class="ch-lado" data-motor="gemini"><span></span><span class="ch-nome">Gemini</span></button>
        <button class="ch-lado" data-motor="grok"><span></span><span class="ch-nome">Grok</span></button>
      </div>
      <!-- redesenho 26/09: seletor à esquerda; à direita branch, medidor e fechar (README, "Painel de chat") -->
      <div class="hd-lado hd-dir">
      <!-- leva 10.4: branch do git desta pasta; some sozinho fora de repositório -->
      <button class="p-git hidden" title="Branch do git"></button>
      <!-- medidor de contexto: existia so no molde do celular e a tela do Mac ficava sem ele -->
      <span class="p-tokens" title="Tamanho da conversa agora, comparado ao que cabe neste modelo"></span>
      <span class="p-dot dot off"></span>
      <button class="p-close" title="Fechar este chat (⌘W)"><svg viewBox="0 0 16 16" class="ic" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7"></path></g></svg></button>
      </div>
    </header>
    <div class="modal p-modal hidden"><div class="modal-cx"></div></div>
    <div class="modal p-visor hidden"><div class="visor-cx">
      <div class="visor-top"><span class="visor-nome"></span>
        <button class="visor-abrir" title="Abrir no Mac"></button>
        <button class="visor-x" title="Fechar (Esc)"></button></div>
      <div class="visor-corpo"></div>
    </div></div>
    <div class="pane-nome"><span class="pn-txt"></span><button class="pn-edit" title="Renomear conversa"></button></div>
    <div class="pane-chat">
      <div class="pane-empty">
        <div class="pe-logo"></div>
      </div>
    </div>
    <div class="pane-perm hidden">
      <div class="pp-txt"></div>
      <div class="pp-btns"><button class="pp-yes">Permitir</button><button class="pp-no">Negar</button></div>
    </div>
    <div class="pane-cmp">
      <div class="p-uso hidden"></div>
      <div class="p-anexos hidden"></div>
      <div class="cmp-top">
        <textarea class="p-input" rows="1" placeholder="Escreva aqui…"></textarea>
      </div>
      <div class="cmp-bar">
        <button class="cb p-plus" title="Anexar"><svg viewBox="0 0 16 16" class="ic" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M8 3v10M3 8h10"></path></g></svg></button>
        <button class="cb p-slash" title="Ações e comandos">/</button>
        <button class="cb p-modoenvio" title="O que fazer se ele já estiver trabalhando"></button>
        <button class="cb p-plano hidden" aria-pressed="false" title="Planejar antes de executar"></button>
        <!-- o anel que enche conforme a conversa cresce; clicar resume e libera espaço -->
        <button class="p-compactar hidden" title="Resumir a conversa para liberar espaço">
          <svg class="an" viewBox="0 0 36 36">
            <circle class="an-fundo" cx="18" cy="18" r="15"></circle>
            <circle class="an-fio" cx="18" cy="18" r="15"></circle>
          </svg>
          <span class="cp-txt"></span>
        </button>
        <!-- a pasta do chat mora aqui como ícone; o nome aparece ao passar o mouse -->
        <button class="cb p-cwd" title="Trocar pasta deste painel"></button>
        <span class="cmp-gap"></span>
        <!-- quanto do plano já foi usado: pequeno e sem cor, do lado do modelo -->
        <span class="p-limite"></span>
        <button class="p-model" title="Trocar o modelo e o esforço"></button>
        <button class="modo-btn p-modo" title="O que ele pode fazer sem perguntar">
          <span class="modo-ic"></span><span class="modo-nome">Sem pedir permissão</span>
        </button>
        <button class="p-stop hidden" title="Parar"><svg viewBox="0 0 16 16" class="ic" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4.5" y="4.5" width="7" height="7" rx="1.5" fill="currentColor"></rect></svg></button>
        <button class="p-send" title="Enviar"><svg viewBox="0 0 16 16" class="ic" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 12.5v-9M4.5 7L8 3.5 11.5 7"></path></g></svg></button>
      </div>
    </div>
  </section>
</template>
